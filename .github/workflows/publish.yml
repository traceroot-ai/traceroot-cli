name: Publish npm Package

on:
  release:
    types: [published]
  # Re-run a release's publish after a workflow fix without deleting and
  # recreating the release (which would re-announce it). Runs against the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.3.0"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/traceroot-cli
    permissions:
      contents: read  # gh release view, and checkout
      id-token: write # npm provenance
    steps:
      # actions/checkout resolves a bare ref as refs/heads/<ref> before
      # refs/tags/<ref>, so a branch named v9.9.9 would shadow a tag of the
      # same name and publish that branch head. Require a real release, then
      # check out its tag explicitly.
      - name: Verify the tag is a published release
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$IS_DRAFT" != "false" ]; then
            echo "::error::$TAG is not a published release"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing authenticates over OIDC and needs npm >= 11.5.1.
      # Node 20 ships npm 10, so upgrade before publishing. Pinned to the 11
      # line: npm 12 dropped Node 20 (requires ^22.22.2), and `@latest` broke
      # the v0.3.0 publish the day npm 12 shipped.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          TAG_VERSION="${TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # No token: npm verifies the OIDC claim that this run came from this
      # repo and workflow. Configure the trusted publisher on npmjs.com first,
      # or this step fails with an auth error.
      - name: Publish package
        run: npm publish --provenance --access public
