name: Publish npm Package

on:
  release:
    types: [published]
  # Re-run a release's publish after a workflow fix without deleting and
  # recreating the release (which would re-announce it). Runs against the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.3.0"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/traceroot-cli
    permissions:
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          # On the release event this is the tag already; on dispatch, build
          # the tag the input names, never main.
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing authenticates over OIDC and needs npm >= 11.5.1.
      # Node 20 ships npm 10, so upgrade before publishing. Pinned to the 11
      # line: npm 12 dropped Node 20 (requires ^22.22.2), and `@latest` broke
      # the v0.3.0 publish the day npm 12 shipped.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          TAG_VERSION="${TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # assets/skills/ is committed, so it is in this checkout — but whether it
      # reaches the archive is decided by `files` in package.json, and .npmrc
      # sets `ignore-scripts=true`, which suppresses this package's own
      # lifecycle hooks: neither `prepack` nor `prepublishOnly` can vet the
      # result. A publish missing those files would succeed and ship a CLI with
      # no skills to install. Pack for real and read the archive instead.
      - name: Tarball carries the bundled skills
        run: npm run pack:check

      # No token: npm verifies the OIDC claim that this run came from this
      # repo and workflow. Configure the trusted publisher on npmjs.com first,
      # or this step fails with an auth error.
      - name: Publish package
        run: npm publish --provenance --access public
