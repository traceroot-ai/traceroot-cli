name: Lint & Format

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: OpenAPI codegen drift check
        # Skipped on early branches that don't vendor the schema yet; runs once
        # the codegen:check script exists.
        run: npm run codegen:check --if-present

      # Not conditional, unlike the step above: the script and this step land
      # together, and a skipped provenance check is indistinguishable from a
      # passing one. It needs nothing but the committed tree — no build, no
      # network — so there is no checkout in which it cannot run.
      - name: Vendored skills provenance check
        run: npm run skills:check

      - name: Typecheck
        run: npm run typecheck

      - name: Biome lint
        run: npm run lint

      - name: Biome format check
        run: npm run format:check
